spring.application.name=laboratoire-protheses
server.port=8085

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${LABO_DB_URL:jdbc:postgresql://localhost:5432/laboratoire_protheses}
spring.datasource.username=${LABO_DB_USER:dentalcare}
spring.datasource.password=${LABO_DB_PASSWORD:change-me-postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
