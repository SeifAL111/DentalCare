spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
management.endpoints.web.exposure.include=health,info,gateway
spring.cloud.gateway.server.webmvc.routes[0].id=dossier-medical
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://dossier-medical
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/dossiers/**
spring.cloud.gateway.server.webmvc.routes[1].id=plan-traitement
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://plan-traitement
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/plans/**,/api/actes-catalogue/**
spring.cloud.gateway.server.webmvc.routes[2].id=agenda-clinique
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://agenda-clinique
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/rdv/**,/api/creneaux/**,/api/liste-attente/**,/api/offres/**
spring.cloud.gateway.server.webmvc.routes[3].id=odontogramme-actes
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://odontogramme-actes
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/actes/**,/api/ordonnances/**,/api/odontogrammes/**
spring.cloud.gateway.server.webmvc.routes[4].id=laboratoire-protheses
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://laboratoire-protheses
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/protheses/**,/api/laboratoires/**
spring.cloud.gateway.server.webmvc.routes[5].id=suivi-postoperatoire
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://suivi-postoperatoire
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/protocoles/**,/api/suivis/**
spring.cloud.gateway.server.webmvc.routes[6].id=coordination-intelligente
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://coordination-intelligente
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/assistant/**,/api/propositions/**,/api/audit/**
