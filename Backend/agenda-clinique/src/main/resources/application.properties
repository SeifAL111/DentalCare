spring.application.name=agenda-clinique
server.port=8083

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Enregistrement avec l'IP (évite les 503 du Gateway quand le nom de la machine ne se résout pas)
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# H2 en mémoire : réservations transactionnelles avec verrou (SELECT ... FOR UPDATE)
spring.datasource.url=jdbc:h2:mem:agenda_clinique;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=10000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Liste d'attente : durée de validité d'une offre de créneau, et fréquence de vérification des expirations
agenda.offres.duree-minutes=15
agenda.offres.verification-ms=60000
